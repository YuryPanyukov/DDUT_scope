[project]
name = "ddut-scope"
version = "1.0.0"
description = "Оценочный комитет — сбор и обработка оценок преподавателей (PyQt5 + openpyxl)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15.0",
    # Qt 5.15.3+ не публикуется колёсами для Windows: без этой строки uv берёт
    # pyqt5-qt5 5.15.19 и установка на Windows падает («no wheel for the current
    # platform»). На Linux и macOS ограничение не действует.
    "PyQt5-Qt5<5.15.3; sys_platform == 'win32'",
    "openpyxl>=3.0.0",
]

[project.scripts]
main = "evaluation_app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "vulture>=2.16",
]
# Сборка exe: ставится только когда нужна (uv sync --group build).
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation_app"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["real_data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "DTZ",   # локальное время уместно в десктопном приложении
    "BLE001", # файловые операции и openpyxl кидают разные исключения
    "S110",  # осознанный try/except/pass при освобождении ресурсов
    "PYI",   # правила для stub-файлов мешают переопределениям методов PyQt
    "RUF001", # кириллица в строках и комментариях
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.vulture]
# Поиск мёртвого кода: запускается в CI командой `uv run vulture` (без аргументов
# берёт настройки отсюда). Тесты включены в обход специально: API, которое
# вызывается только из тестов, живым и считается, поэтому не шумит.
paths = ["evaluation_app", "tests", "scripts"]
exclude = ["real_data", ".venv", "build", "dist"]
# Минимальный порог: 60% — ровно та уверенность, с которой vulture сообщает о
# неиспользуемых функциях, классах, методах и свойствах. Ниже начинается шум от
# совпадений имён в строках, а выше новые мёртвые функции молча пропускаются —
# поэтому порог нельзя поднимать. Он зафиксирован тестом
# tests/test_packaging.py::test_dead_code_threshold_is_minimal.
min_confidence = 60
# Ложные срабатывания, которые нельзя убрать из кода:
#   closeEvent, eventFilter — методы вызываются только Qt, а не нашим кодом;
#   qapp — фикстура pytest, используется через параметры тестов;
#   fill/alignment/border/number_format — атрибуты ячеек openpyxl читает сама.
ignore_names = ["closeEvent", "eventFilter", "qapp", "fill", "alignment", "border", "number_format"]
